{% load static %}<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ota-ona kabineti</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="{% static 'web/mini.css' %}">
<style>*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--tg-theme-bg-color,#f6f6f4);color:var(--tg-theme-text-color,#26251f)}h1{font-size:20px;margin:0}.sub{color:var(--tg-theme-hint-color,#75736a);font-size:12px}.card{background:var(--tg-theme-secondary-bg-color,#fff);border-radius:14px;padding:16px;margin-top:12px}.qr{text-align:center}.qr img{width:230px;max-width:90%;background:#fff;border-radius:10px}.code{font-size:30px;letter-spacing:6px;font-weight:750;margin:8px}.name{font-size:17px;font-weight:650}.row{display:flex;justify-content:space-between;gap:12px;margin-top:10px}.label{color:var(--tg-theme-hint-color,#75736a)}.value{text-align:right;font-weight:550}.debt{color:#b3261e}.advance{color:#1a6b3c}.error{padding:14px;background:#fdeaea;color:#a02020;border-radius:10px}</style></head>
<body><h1>Topshirish / olib ketish</h1><div class="sub" id="hello">Yuklanmoqda…</div><main id="content"></main>
<script>(async()=>{const tg=Telegram.WebApp;tg.ready();tg.expand();const box=document.getElementById('content');let session,contact;try{session=await post('/telegram/mini/session/',{});document.getElementById('hello').textContent=(session.user.first_name||'Ota-ona')+', xush kelibsiz';contact=session.contacts[0];if(!contact)throw Error('Profilga kontakt biriktirilmagan');render();await refresh();setInterval(refresh,45000)}catch(e){box.innerHTML=err(e.message)}
function render(){box.innerHTML=`<section class="card qr"><div class="name" id="person"></div><div class="sub">QR har 60 soniyada yangilanadi</div><img id="qr"><div class="sub">QR ishlamasa 5 daqiqalik kod:</div><div class="code" id="code">------</div><div class="sub" id="countdown"></div></section>`+session.children.map(c=>{const n=+c.balance;return `<section class="card"><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.group)}</div><div class="row"><span class="label">Bugun</span><b>${esc(c.attendance)}</b></div><div class="row"><span class="label">Balans</span><b class="${n>0?'debt':n<0?'advance':''}">${money(n)}</b></div></section>`}).join('');document.getElementById('person').textContent=contact.name+' · '+contact.relation}
async function refresh(){try{const d=await post('/telegram/parent/credential/',{contactId:contact.id});document.getElementById('qr').src='/telegram/contact-qr/?token='+encodeURIComponent(d.token);document.getElementById('code').textContent=d.code;const end=new Date(d.qrExpiresAt);const tick=()=>{const s=Math.max(0,Math.ceil((end-new Date)/1000));document.getElementById('countdown').textContent='QR: '+s+' soniya';if(s)setTimeout(tick,250)};tick()}catch(e){document.getElementById('countdown').textContent=e.message}}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,...data})});const d=await r.json();if(!r.ok)throw Error(d.error);return d}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(n){return new Intl.NumberFormat('uz-UZ').format(n)+' so‘m'}function err(s){return '<div class="error">'+esc(s)+'</div>'}})();</script></body></html>
