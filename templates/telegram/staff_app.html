{% load static %}<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kirish / chiqish</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="{% static 'web/mini.css' %}">
<style>*{box-sizing:border-box}body{margin:0;padding:14px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--tg-theme-bg-color,#f5f5f3);color:var(--tg-theme-text-color,#222)}h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--tg-theme-hint-color,#777)}.tabs,.actions{display:flex;gap:8px;margin:12px 0}.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:650;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);flex:1}.btn.alt{background:var(--tg-theme-secondary-bg-color,#fff);color:var(--tg-theme-text-color,#222)}.btn.danger{background:#b3261e}.card{background:var(--tg-theme-secondary-bg-color,#fff);border-radius:14px;padding:15px;margin-top:10px}.person{font-size:18px;font-weight:700}.child{display:flex;gap:10px;padding:12px 0;border-top:1px solid rgba(128,128,128,.18)}.child input{width:20px}.warning{background:#fff3cd;color:#725500;padding:9px;border-radius:8px;margin-top:7px}.denied{background:#fde5e5;color:#9b1c1c;padding:14px;border-radius:12px;margin-top:10px}.ok{background:#e2f3e8;color:#176b3a;padding:14px;border-radius:12px;margin-top:10px}.input{width:100%;padding:11px;border:1px solid #bbb;border-radius:9px;font:inherit}.pending{background:#fff3cd;color:#725500;padding:8px;border-radius:8px;margin:8px 0}</style></head>
<body><h1>Kirish / chiqish</h1><div class="sub">Native Telegram QR skaneri · server tasdig‘i</div><div id="pending"></div>
<div class="tabs"><button class="btn" id="mode-in">Qabul qilish</button><button class="btn alt" id="mode-out">Topshirish</button></div>
<div class="actions"><button class="btn" id="scan">📷 Skanerlash</button><button class="btn alt" id="code-btn">123456 kod</button></div><main id="result"></main>
<script>(()=>{const tg=Telegram.WebApp;tg.ready();tg.expand();let kind='in',credential=null,resolved=null,cache=JSON.parse(localStorage.getItem('staffCache')||'{"contacts":{}}');const result=document.getElementById('result');const q=JSON.parse(localStorage.getItem('checkQueue')||'[]');showPending();bootstrap();flush();
document.getElementById('mode-in').onclick=()=>mode('in');document.getElementById('mode-out').onclick=()=>mode('out');function mode(v){kind=v;document.getElementById('mode-in').className='btn '+(v==='in'?'':'alt');document.getElementById('mode-out').className='btn '+(v==='out'?'':'alt');result.innerHTML=''}
document.getElementById('scan').onclick=()=>{if(!tg.showScanQrPopup){return error('Telegram versiyasi native QR skanerni qo‘llamaydi')}tg.showScanQrPopup({text:kind==='in'?'Ota-ona QR kodini skanerlang':'Olib ketuvchi QR kodini skanerlang'},text=>{tg.closeScanQrPopup();resolve({token:text});return true})};document.getElementById('code-btn').onclick=()=>{const code=prompt('6 xonali kodni kiriting');if(code)resolve({code:code.trim()})};
async function bootstrap(){try{cache=await post('/telegram/staff/bootstrap/',{});localStorage.setItem('staffCache',JSON.stringify(cache))}catch(e){}}
async function resolve(cred){credential=cred;try{resolved=await post('/telegram/staff/resolve/',{...cred,kind});render()}catch(e){const contactId=cred.token?.split('.')[1];if(contactId&&cache.contacts?.[contactId]){resolved=cache.contacts[contactId];resolved.offline=true;render();document.getElementById('pending').innerHTML='<div class="pending">⚠️ Offline ma’lumot. Server tasdig‘i internet qaytganda olinadi.</div>'}else error(e.message)}}
function render(){const p=resolved.person;const denied=kind==='out'&&resolved.children.some(c=>!c.canPickup);result.innerHTML=`<section class="card"><div class="person">${esc(p.name)}</div><div class="sub">${esc(p.relation)} · ${esc(p.phone)}</div>${denied?'<div class="denied">⛔ Bu odam ayrim bolalarni olib ketishga ruxsat etilmagan.</div>':''}<div id="children">${resolved.children.map(c=>`<label class="child"><input type="checkbox" value="${c.enrollmentId}" ${kind==='in'?!c.inside:c.inside?'checked':''}><span><b>${esc(c.name)}</b><div class="sub">${esc(c.group)} · ${c.inside?'bog‘chada':'tashqarida'}</div>${c.allergies?`<div class="warning">⚠️ Allergiya: ${esc(c.allergies)}</div>`:''}${c.healthNote?`<div class="warning">Sog‘liq: ${esc(c.healthNote)}</div>`:''}${kind==='out'&&!c.canPickup?'<div class="denied">Olib ketish ruxsati yo‘q</div>':''}</span></label>`).join('')}</div>${denied&&resolved.canOverride?'<input class="input" id="override" placeholder="Direktor ruxsati sababi (majburiy)">':''}<button class="btn ${denied?'danger':''}" id="confirm" ${denied&&!resolved.canOverride?'disabled':''}>${denied?'Direktor sifatida tasdiqlash':'Tasdiqlash'}</button></section>`;document.getElementById('confirm').onclick=confirm}
async function confirm(){const ids=[...document.querySelectorAll('#children input:checked')].map(x=>x.value);if(!ids.length)return error('Kamida bitta bolani tanlang');const idem={};ids.forEach(id=>idem[id]=crypto.randomUUID());const payload={...credential,kind,enrollmentIds:ids,idempotency:idem,overrideReason:document.getElementById('override')?.value||'',device:navigator.userAgent,scannedAt:new Date().toISOString()};if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{payload.latitude=p.coords.latitude.toFixed(6);payload.longitude=p.coords.longitude.toFixed(6);send(payload)},()=>send(payload),{timeout:2500});else send(payload)}
async function send(payload){try{const d=await post('/telegram/staff/confirm/',payload);result.innerHTML=`<div class="ok">✅ ${d.count} ta bola bo‘yicha amal saqlandi.</div>`;tg.HapticFeedback?.notificationOccurred('success');setTimeout(()=>document.getElementById('scan').click(),700)}catch(e){if(!navigator.onLine||/fetch/i.test(e.message)){payload.offline=true;q.push(payload);save();result.innerHTML='<div class="pending">Internet yo‘q. Amal navbatga saqlandi.</div>'}else error(e.message)}}
async function flush(){if(!navigator.onLine||!q.length)return;for(let i=q.length-1;i>=0;i--)try{await post('/telegram/staff/confirm/',q[i]);q.splice(i,1)}catch(e){}save()}function save(){localStorage.setItem('checkQueue',JSON.stringify(q));showPending()}function showPending(){document.getElementById('pending').innerHTML=q.length?`<div class="pending">⚠️ ${q.length} ta yozuv yuborilmagan</div>`:''}window.addEventListener('online',flush);
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,...data})});const d=await r.json();if(!r.ok)throw Error(d.error||'Server xatosi');return d}function error(s){result.innerHTML='<div class="denied">'+esc(s)+'</div>';tg.HapticFeedback?.notificationOccurred('error')}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}})();</script></body></html>
